version: 2
updates:
  # Enable version updates for NuGet packages. The root solution resolves to
  # src/JellyfinEnhanced.csproj; the backend test programs are listed explicitly.
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/src/features/analytics/tests/server"
      - "/src/features/hidden-content/tests/server"
      - "/src/features/ratings/tests/server"
      - "/src/features/seerr/tests/server/automatic-requests"
      - "/src/features/seerr/tests/server/parental-filter"
      - "/src/features/spoiler-guard/tests/server"
      - "/src/features/tags/tests/server"
      - "/src/host/assets/tests/server"
      - "/tests/compatibility/api"
      - "/tests/compatibility/configuration/storage"
      - "/tests/compatibility/integration/plugin-pages"
      - "/tests/compatibility/resources"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "n00bcodr"
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group minor and patch updates together
    groups:
      jellyfin-dependencies:
        patterns:
          - "Jellyfin.*"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        patterns:
          - "*.Analyzers"
          - "*.CodeAnalysis"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "n00bcodr"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
